[package]
name = "common"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.2"

[lib]
doctest = false

# the capture pipe + `cargo test` harness makes these tests flaky if not run on
# a single thread (`cargo test -- --test-threads=1`), this achieves effectively
# the same thing but isolates to this specific set of cases.
[[test]]
name = "console_stdio"
harness = false

[default-features]
stdout = []
