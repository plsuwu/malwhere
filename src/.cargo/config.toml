[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
runner = "wine"

[target.x86_64-pc-windows-gnu]
runner = "wine"
linker = "x86_64-w64-mingw32-gcc"

[alias]
run-gnu = "run --target x86_64-pc-windows-gnu"
test-gnu = "test --target x86_64-pc-windows-gnu"
build-gnu = "build --target x86_64-pc-windows-gnu"
